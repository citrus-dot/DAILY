<svg viewBox="0 0 1200 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DAILY 技术架构图">
  <title>DAILY 技术架构</title>
  <desc>浏览器与安卓应用两个入口，共用同一个单文件 HTML，数据存于本地 localStorage，原生能力经 Capacitor 桥接。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#F7F6F2"/>

  <text x="600" y="46" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1F2937">技术架构</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="130" y="80" width="420" height="72" rx="12" fill="#EEEDE9" stroke="#C9CCC4" stroke-width="1"/>
    <text x="340" y="108" text-anchor="middle" font-size="18" font-weight="500" fill="#2C2C2A">macOS / 浏览器</text>
    <text x="340" y="132" text-anchor="middle" font-size="14" fill="#5F5E5A">双击 DAILY.html 即开</text>

    <rect x="650" y="80" width="420" height="72" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
    <text x="860" y="108" text-anchor="middle" font-size="18" font-weight="500" fill="#0F6E56">Android 桌面应用</text>
    <text x="860" y="132" text-anchor="middle" font-size="14" fill="#0F6E56">Capacitor 封装 · 可侧载 APK</text>
  </g>

  <path d="M340 152 L340 200" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M860 152 L860 200" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="170" y="206" width="860" height="150" rx="16" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/>
    <text x="600" y="240" text-anchor="middle" font-size="19" font-weight="600" fill="#2C2C2A">单文件 HTML · DAILY.html</text>
    <rect x="230" y="262" width="185" height="40" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
    <text x="322" y="286" text-anchor="middle" font-size="14" fill="#444441">CSS / JS 全内联</text>
    <rect x="430" y="262" width="185" height="40" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
    <text x="522" y="286" text-anchor="middle" font-size="14" fill="#444441">手写 SVG 图标</text>
    <rect x="630" y="262" width="185" height="40" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
    <text x="722" y="286" text-anchor="middle" font-size="14" fill="#444441">零外部请求</text>
    <rect x="830" y="262" width="185" height="40" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
    <text x="922" y="286" text-anchor="middle" font-size="14" fill="#444441">中文字体内嵌</text>
    <text x="600" y="336" text-anchor="middle" font-size="14" fill="#5F5E5A">四个视图（今日 / 类别 / 统计 / 待办）共用一个状态对象</text>
  </g>

  <path d="M430 356 L340 404" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M770 356 L860 404" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="130" y="410" width="420" height="110" rx="12" fill="#EAF3DE" stroke="#C0DD97" stroke-width="1"/>
    <text x="340" y="442" text-anchor="middle" font-size="18" font-weight="500" fill="#3B6D11">本地存储 localStorage</text>
    <text x="340" y="468" text-anchor="middle" font-size="14" fill="#444441">键 wb_daily_state · 纯本地</text>
    <text x="340" y="490" text-anchor="middle" font-size="14" fill="#444441">不上云 · 可导出 JSON / CSV / MD</text>

    <rect x="650" y="410" width="420" height="110" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
    <text x="860" y="442" text-anchor="middle" font-size="18" font-weight="500" fill="#185FA5">Capacitor 原生桥（安卓）</text>
    <text x="860" y="468" text-anchor="middle" font-size="14" fill="#444441">本地通知（每日提醒）· 分享接收</text>
    <text x="860" y="490" text-anchor="middle" font-size="14" fill="#444441">SAF 系统保存框（导出选路径）</text>
  </g>
</svg>
